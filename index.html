<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ИГН · виртуальный тур</title>
  <meta name="description" content="Виртуальный 360° тур Института гуманитарных наук Алтайского государственного университета.">
  <meta name="theme-color" content="#0b1c33">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="vendor/pannellum.css">
  <link rel="stylesheet" href="css/style.css?v=5">
</head>
<body>
  <div id="app" class="app">
    <div id="viewer" class="viewer"></div>
    <div id="fade" class="fade" hidden></div>

    <header class="top">
      <div class="brand">
        <span class="mark" aria-hidden="true">
          <svg viewBox="0 0 48 48"><path d="M6 28c7-1 9-9 18-16 9 7 11 15 18 16-7 1-11-3-18-3S13 29 6 28z" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M24 12v18" stroke="currentColor" stroke-width="1.4"/></svg>
        </span>
        <div class="brand-text">
          <p class="kicker">ИГН · АлтГУ</p>
          <h1 id="scene-title">Белые столы</h1>
          <p id="scene-kicker" class="sub">Аудитория</p>
        </div>
      </div>
      <nav class="tools" aria-label="Управление туром">
        <button type="button" data-action="list">Локации</button>
        <button type="button" data-action="room">О пространстве</button>
        <button type="button" data-action="spin" id="spin-btn">Автоповорот</button>
        <button type="button" data-action="full">На весь экран</button>
        <button type="button" data-action="help">Помощь</button>
        <button type="button" data-action="about">Об институте</button>
      </nav>
    </header>

    <aside id="rail" class="rail" aria-label="Список локаций"></aside>
    <div class="compass" aria-hidden="true"><span>С</span><i id="needle"></i></div>
    <aside id="hotspot" class="card" hidden></aside>

    <footer class="dock">
      <button type="button" id="toggle-strip" class="pill">Скрыть локации</button>
      <div id="strip-wrap" class="strip-wrap">
        <button type="button" id="prev" class="round" aria-label="Предыдущая локация">‹</button>
        <div id="strip" class="strip"></div>
        <button type="button" id="next" class="round" aria-label="Следующая локация">›</button>
      </div>
    </footer>

    <div id="sheet" class="sheet" hidden>
      <button type="button" class="sheet-bg" data-close aria-label="Закрыть"></button>
      <div class="sheet-panel" role="dialog" aria-modal="true">
        <div class="sheet-head">
          <p id="sheet-kicker" class="kicker"></p>
          <button type="button" class="round" data-close aria-label="Закрыть окно">×</button>
        </div>
        <div id="sheet-body"></div>
      </div>
    </div>

    <div id="loader" class="loader">
      <img src="assets/cover.jpg" alt="">
      <div class="loader-shade"></div>
      <div class="loader-card">
        <span class="mark" aria-hidden="true">
          <svg viewBox="0 0 48 48"><path d="M6 28c7-1 9-9 18-16 9 7 11 15 18 16-7 1-11-3-18-3S13 29 6 28z" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M24 12v18" stroke="currentColor" stroke-width="1.4"/></svg>
        </span>
        <p class="kicker">Алтайский государственный университет</p>
        <h2>Институт гуманитарных наук</h2>
        <p class="lead">Виртуальный тур по аудиториям и студиям.</p>
      </div>
    </div>
  </div>
  <script src="vendor/pannellum.js"></script>
  <script src="js/tour.js?v=5"></script>
  <script>
    setTimeout(function () {
      var el = document.getElementById("loader");
      if (el) el.classList.add("hide");
    }, 900);
  </script>
</body>
</html>
